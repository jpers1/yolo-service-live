services:
  api:
    build:
      context: .
      args:
        INSTALL_TARGET: .
    image: yolo-service-live:fake
    ports:
      - "8000:8000"
    environment:
      YOLO_SERVICE_ENVIRONMENT: development
      YOLO_SERVICE_API_KEY: change-me-local-dev-key
      YOLO_SERVICE_DETECTOR_BACKEND: fake
      YOLO_SERVICE_PUBLIC_MODEL_NAME: yolo11n-coco
      YOLO_SERVICE_MODEL_WEIGHTS: yolo11n.pt
      YOLO_SERVICE_DEFAULT_CONFIDENCE: "0.25"
      YOLO_SERVICE_MAX_REQUEST_BYTES: "5242880"
      YOLO_SERVICE_MAX_IMAGE_PIXELS: "4194304"
